# HTTP — Railway inyecta PORT; en local usa 8080
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

# MySQL — Railway (MYSQLHOST, …) o estándar (MYSQL_HOST, …) o localhost
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${MYSQLUSER:${MYSQL_USER:root}}
quarkus.datasource.password=${MYSQLPASSWORD:${MYSQL_PASSWORD:1234}}
quarkus.datasource.jdbc.url=jdbc:mysql://${MYSQLHOST:${MYSQL_HOST:localhost}}:${MYSQLPORT:${MYSQL_PORT:3306}}/${MYSQLDATABASE:${MYSQL_DATABASE:auth_db}}?characterEncoding=UTF-8&useUnicode=true&serverTimezone=UTC&useSSL=${MYSQL_SSL:false}&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:8}
quarkus.datasource.jdbc.min-size=${DB_POOL_MIN:0}

# Hibernate crea/actualiza tablas a partir de las entidades
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.sql-load-script=no-file

# JWT HS256 — el JWK HMAC lo publica JwtHmacConfigSource desde JWT_SECRET
mp.jwt.verify.issuer=${JWT_ISSUER:auth-base}
smallrye.jwt.verify.algorithm=HS256
smallrye.jwt.new-token.issuer=${JWT_ISSUER:auth-base}

# CORS — lista separada por comas
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:${FRONTEND_URL:http://localhost:5173}}
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=86400
quarkus.http.limits.max-body-size=12M

# Archivos subidos (título profesional, avatares, tapas). No es público.
app.storage.dir=${STORAGE_DIR:storage}

# Auth app
app.auth.issuer=${JWT_ISSUER:auth-base}
app.auth.access-token-ttl=${JWT_ACCESS_TTL:PT15M}
app.auth.refresh-token-ttl=${JWT_REFRESH_TTL:P14D}
app.auth.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
app.auth.lock-duration=${AUTH_LOCK_DURATION:PT15M}
app.auth.jwt-secret=${JWT_SECRET:local-dev-only-secret-key-32-chars-min}
app.auth.bootstrap-admin-email=${AUTH_BOOTSTRAP_ADMIN_EMAIL:}
app.auth.bootstrap-admin-password=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
app.auth.bootstrap-admin-name=${AUTH_BOOTSTRAP_ADMIN_NAME:Administrador}
app.auth.bootstrap-admin-last-name=${AUTH_BOOTSTRAP_ADMIN_LAST_NAME:Admin}
app.auth.password-reset-token-ttl=${PASSWORD_RESET_TTL:PT30M}
app.auth.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Mail — local default: Mailpit (SMTP 1025, UI http://localhost:8025)
# Para Brevo: seteá MAIL_* en .env (ver comentarios ahí).
# En DEV Quarkus mockea el mailer por defecto: hay que apagarlo para SMTP real.
quarkus.mailer.from=${MAIL_FROM:Auth Base <noreply@localhost>}
quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:1025}
quarkus.mailer.start-tls=${MAIL_START_TLS:DISABLED}
quarkus.mailer.login=${MAIL_LOGIN:DISABLED}
quarkus.mailer.username=${MAIL_USERNAME:}
quarkus.mailer.password=${MAIL_PASSWORD:}
%dev.quarkus.mailer.mock=false
%test.quarkus.mailer.mock=true

# Brevo HTTP API (recomendado en Railway: el puerto SMTP 587 suele estar bloqueado)
# Si BREVO_API_KEY está definida, MailService usa la API y no SMTP.
brevo.api-key=${BREVO_API_KEY:}

# Jackson
quarkus.jackson.fail-on-unknown-properties=false
quarkus.jackson.timezone=UTC

# OpenAPI / Swagger (desactivado en prod salvo que lo habilites)
quarkus.smallrye-openapi.info-title=Periódico API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Autenticación, periodistas verificados y artículos
quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.enable=${SWAGGER_ENABLED:false}

# Health
quarkus.smallrye-health.root-path=/q/health

# Banner
quarkus.application.name=auth-api
quarkus.banner.enabled=false

# Tests: H2 en memoria; Hibernate crea el esquema
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:auth;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
%test.quarkus.hibernate-orm.schema-management.strategy=update
%test.app.storage.dir=target/test-storage
%test.mp.jwt.verify.issuer=auth-base
%test.app.auth.jwt-secret=local-dev-only-secret-key-32-chars-min
%test.app.auth.bootstrap-admin-email=admin@example.com
%test.app.auth.bootstrap-admin-password=Admin1234!
%test.app.auth.bootstrap-admin-name=Administrador
%test.quarkus.devservices.enabled=false
